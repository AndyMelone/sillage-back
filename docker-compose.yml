services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=sillage
      - POSTGRES_PASSWORD=sillage
      - POSTGRES_DB=medusa-sillage-back
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=sillage
      - MINIO_ROOT_PASSWORD=sillage123
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
